name: Upstream Sync Check

on:
  # 매주 월요일 오전 9시(KST = UTC+9이므로 UTC 0시)에 자동 실행
  schedule:
    - cron: '0 0 * * 1'
  # 수동으로도 실행 가능
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 0

      - name: upstream remote 등록
        run: |
          git remote add upstream https://github.com/luongnv89/claude-howto.git || true
          git fetch upstream

      - name: 변경 여부 확인
        id: check
        run: |
          BEHIND=$(git rev-list main..upstream/main --count)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

          CHANGED_MD=$(git diff main..upstream/main --name-only -- "*.md" \
            | grep -v "README.backup.md" \
            | grep -v "CHANGELOG.md" \
            | grep -v "RELEASE_NOTES.md" \
            | grep -v "SECURITY.md" \
            | grep -v "CODE_OF_CONDUCT.md" \
            | grep -v "prompts/" \
            || true)

          if [[ -z "$CHANGED_MD" ]]; then
            echo "has_md_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_md_changes=true" >> "$GITHUB_OUTPUT"
            # 파일 목록을 멀티라인 안전하게 저장
            {
              echo "changed_files<<EOF"
              echo "$CHANGED_MD"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 변경 없음 — 종료
        if: steps.check.outputs.behind == '0'
        run: echo "upstream과 동일합니다. 업데이트 불필요."

      - name: 번역 업데이트 이슈 생성
        if: steps.check.outputs.has_md_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = `${{ steps.check.outputs.changed_files }}`;
            const behind = `${{ steps.check.outputs.behind }}`;
            const fileList = changedFiles.split('\n')
              .filter(Boolean)
              .map(f => `- [ ] \`${f}\``)
              .join('\n');

            const body = `## upstream 번역 업데이트 필요

            upstream (\`luongnv89/claude-howto\`)이 **${behind}개 커밋** 앞서 있으며, 아래 파일들의 한국어 번역 업데이트가 필요합니다.

            ### 번역 필요 파일

            ${fileList}

            ### 업데이트 방법

            \`\`\`bash
            # 자동 번역 (Claude Code 필요)
            ./scripts/sync-and-translate.sh --apply

            # 또는 수동으로 main 동기화 후 파일별 번역
            git fetch upstream
            git checkout main && git merge upstream/main
            git checkout korean && git merge main
            # 위 파일들을 직접 번역
            \`\`\`

            > 이 이슈는 GitHub Actions에 의해 자동 생성됐습니다.`;

            // 이미 열린 동일 이슈가 있으면 스킵
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'translation-update'
            });

            if (existingIssues.data.length > 0) {
              console.log('이미 번역 업데이트 이슈가 열려 있습니다. 스킵.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[번역 업데이트] upstream ${new Date().toISOString().slice(0,10)} 변경사항`,
              body: body,
              labels: ['translation-update']
            });

      - name: md 변경 없는 경우 main만 동기화
        if: steps.check.outputs.behind != '0' && steps.check.outputs.has_md_changes == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
          git checkout korean
          git merge main --no-edit
          git push origin korean
          echo "✅ .md 변경 없음 — main/korean 자동 동기화 완료."
